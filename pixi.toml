[workspace]
authors = ["Locietta <locietta@gmail.com>"]
channels = ["https://prefix.dev/locietta-toolchains", "conda-forge"]
name = "liminal"
platforms = ["win-64"]
version = "0.1.0"

[tasks]
setup-hooks = "python scripts/setup_hooks.py"
build = "xmake build -y"
test-unit = "xmake test"
test-integration = "python -m pytest tests/integration -v"
test-all = { depends-on = ["test-unit", "test-integration"] }

[dependencies]
python = ">=3.14"
ninja = "*"
cmake = ">=4.4.0"
clang-format = "==22.1.8"
pytest = ">=8"
