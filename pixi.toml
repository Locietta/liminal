[workspace]
authors = ["Locietta <locietta@gmail.com>"]
channels = ["conda-forge"]
name = "liminal"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[tasks]
setup-hooks = "python scripts/setup_hooks.py"
format = "python scripts/format.py"
format-check = "python scripts/format.py --check ."
configure = "xmake f -m releasedbg --sanitizers=n -y" # we use releasedbg for development and testing
configure-release = "xmake f -m release --sanitizers=n -y"
configure-sanitize = "xmake f -m releasedbg --sanitizers=y -y"
build = "xmake build -y"
package = "python scripts/package.py package"
install = "python scripts/package.py install"
test-unit = "xmake test"
test-integration = { cmd = "python -m pytest tests/integration -v", depends-on = [
  "build",
] }
test-all = { cmd = "xmake test && python -m pytest tests/integration -v", depends-on = [
  "build",
] }
test-linux = "python scripts/test_wsl.py"
test-linux-release = "python scripts/test_wsl.py --mode release"
test-linux-sanitize = "python scripts/test_wsl.py --mode sanitize"

[dependencies]
python = ">=3.14"
ninja = "*"
cmake = ">=4.4.0"
clang-format = "==22.1.8"
ruff = "==0.16.1"
prettier = "==3.9.3"
taplo = "==0.10.0"
pytest = ">=8"
# C dependencies. These are C ABI only, so the MSVC-built Windows builds link
# fine from GCC; see lighter/xmake.lua for the libuv import-library caveat.
libuv = ">=1.52.1,<2"
libcurl = ">=8.21.0,<9"
libiconv = ">=1.18,<2"

# GCC 16 is the only toolchain currently shipping P2996 static reflection
# (-freflection) and P2900 contracts, which this project depends on.
[target.win-64.dependencies]
gcc_win-64 = "16.1.*"
gxx_win-64 = "16.1.*"

[target.linux-64.dependencies]
gcc = "16.1.*"
gxx = "16.1.*"
