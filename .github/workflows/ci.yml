name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes any run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (gcc)
            os: ubuntu-latest
            cache: ~/.xmake/packages
          - name: Windows (mingw)
            os: windows-latest
            cache: ~/AppData/Local/.xmake/packages
    steps:
      # xmake/ is a submodule holding the pinned package recipes, the custom
      # package managers and the build rules; without it xmake cannot configure.
      - uses: actions/checkout@main
        with:
          submodules: true

      # pixi provides everything the build needs: the GCC 16 toolchain (the only
      # one shipping -freflection and contracts), the C dependencies, and
      # python/pytest for the integration tests. xmake is deliberately NOT a pixi
      # dependency - it writes a global config that the system xmake shares, so a
      # second copy inside the environment would clash with it for no gain.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - uses: xmake-io/github-action-setup-xmake@v1

      # Only the header-only packages (glaze, ...) are built from source; the
      # rest come from the pixi environment.
      - name: Cache xmake packages
        uses: actions/cache@main
        with:
          path: ${{ matrix.cache }}
          key: xmake-${{ runner.os }}-${{ hashFiles('xmake/packages/**/xmake.lua') }}
          restore-keys: xmake-${{ runner.os }}-

      # The toolchain and the C dependencies both live in the pixi environment,
      # so every xmake invocation has to run under `pixi run`. On Windows this
      # also selects xmake's `mingw` platform (see the root xmake.lua).
      - name: Configure
        run: pixi run xmake f -m releasedbg -y

      - name: Build
        run: pixi run build

      - name: Test
        run: pixi run test-all
