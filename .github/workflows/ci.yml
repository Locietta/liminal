name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes any run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-latest
    # Arch is the only distro currently shipping a gcc with P2996 static
    # reflection (-freflection), which lighter/utils/enum.h requires. Upstream
    # clang cannot build this project at all - it rejects -freflection and
    # cannot parse `template for`.
    container: archlinux:latest
    steps:
      - name: Install toolchain and dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            gcc git xmake cmake ninja make pkgconf \
            libuv fmt curl unzip

      # xmake/ is a submodule holding the pinned package recipes, the custom
      # package managers and the build rules; without it xmake cannot configure.
      - uses: actions/checkout@main
        with:
          submodules: true

      # xmake refuses to run as root unless told the risk is understood; CI
      # containers have no other user.
      - name: Allow xmake to run as root
        run: echo "XMAKE_ROOT=y" >> "$GITHUB_ENV"

      # Only glaze is built from source; the rest come from pacman.
      - name: Cache xmake packages
        uses: actions/cache@main
        with:
          path: ~/.xmake/packages
          key: xmake-linux-${{ hashFiles('xmake/packages/**/xmake.lua') }}
          restore-keys: xmake-linux-

      - name: Configure
        run: xmake f -m releasedbg -y

      - name: Build
        run: xmake -j$(nproc)

      - name: Test
        run: xmake test

  windows:
    name: Windows (ucrt64)
    runs-on: windows-latest
    steps:
      # xmake/ is a submodule holding the pinned package recipes, the custom
      # package managers and the build rules; without it xmake cannot configure.
      - uses: actions/checkout@main
        with:
          submodules: true

      # MSYS2 is the toolchain and library provider only - the steps below
      # deliberately do NOT run in an msys2 shell. Running xmake from inside one
      # makes it detect the `msys` platform, which takes a different code path
      # from the `windows` platform developers build locally; the msys2::
      # package manager then fails to resolve libiconv. Native xmake plus an
      # MSYS2 toolchain is the combination the root xmake.lua is written for.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libuv
            mingw-w64-ucrt-x86_64-fmt
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-libiconv

      - uses: xmake-io/github-action-setup-xmake@v1

      # The root xmake.lua resolves the toolchain from %MSYS2%, refusing to
      # configure without it, and the msys2:: package manager locates pacman
      # under the same root.
      - name: Export MSYS2 root
        run: echo "MSYS2=${{ steps.msys2.outputs.msys2-location }}" >> $env:GITHUB_ENV

      # The test binaries link against the ucrt64 gcc runtime and libuv/fmt/curl
      # DLLs. Nothing puts that directory on PATH for a native (non-msys2) shell,
      # so without this the executables fail to start at all.
      - name: Add ucrt64 to PATH
        run: echo "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" >> $env:GITHUB_PATH

      - name: Cache xmake packages
        uses: actions/cache@main
        with:
          path: ~/AppData/Local/.xmake/packages
          key: xmake-windows-${{ hashFiles('xmake/packages/**/xmake.lua') }}
          restore-keys: xmake-windows-

      - name: Configure
        run: xmake f -m releasedbg -y

      - name: Build
        run: xmake

      - name: Test
        run: xmake test
