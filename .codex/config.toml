[mcp_servers.liminal_dev]
command = "pixi"
args = ["run", "xmake", "run", "liminal-dev-mcp"]
cwd = "."
env_vars = [
  "http_proxy",
  "https_proxy",
  "all_proxy",
  "no_proxy",
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "ALL_PROXY",
  "NO_PROXY",
]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 45
enabled_tools = [
  "session_create",
  "session_apply",
  "session_inspect",
  "session_close",
]
