[mcp_servers.liminal_dev]
command = "pixi"
# Keep xmake output in build/; Windows runs a shadow copy so it remains replaceable.
args = ["run", "python", "scripts/run_dev_mcp.py"]
cwd = "."
env_vars = [
  "http_proxy",
  "https_proxy",
  "all_proxy",
  "no_proxy",
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "ALL_PROXY",
  "NO_PROXY",
]
enabled = true
required = false
startup_timeout_sec = 30
tool_timeout_sec = 45
enabled_tools = [
  "session_create",
  "session_apply",
  "session_inspect",
  "session_close",
]
